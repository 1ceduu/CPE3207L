  <text x="720" y="855" text-anchor="middle" font-size="12" fill="#b91c1c" font-family="Segoe UI, Arial, sans-serif">* Red blocks = resistor voltage dividers protecting 3.3 V ESP32 GPIO from 5 V sensor outputs (ECHO, MQ-135 AO, MAX485 RO)</text>
