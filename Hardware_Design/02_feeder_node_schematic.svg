<svg viewBox="0 0 1440 1020" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace">
  <rect x="0" y="0" width="1440" height="1020" fill="#ffffff"/>
  <text x="720" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif">Feeder Node Wiring Schematic &#8212; ESP32-WROOM-32 (one per pen, &#215;3)</text>
  <text x="720" y="58" text-anchor="middle" font-size="13" fill="#64748b" font-family="Segoe UI, Arial, sans-serif">3.3 V logic MCU &#183; 5 V sensor rail &#183; 12 V actuator rail &#183; red dividers step 5 V signals down to 3.3 V</text>
  <rect x="560" y="180" width="320" height="640" rx="10" fill="#0e7490" stroke="#155e75" stroke-width="2.5"/>
  <text x="720" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">ESP32-WROOM-32</text>
  <text x="720" y="232" text-anchor="middle" font-size="11" fill="#cffafe" font-family="Segoe UI, Arial, sans-serif">38-pin dev board</text>
  <g font-size="12" fill="#ffffff">
    <text x="575" y="270">3V3</text>
    <text x="575" y="300">GPIO36  (Gas AO alt)</text>
    <text x="575" y="330">GPIO34  MQ-135 AO</text>
    <text x="575" y="360">GPIO32  HX711 DT</text>
    <text x="575" y="390">GPIO33  HX711 SCK</text>
    <text x="575" y="420">GPIO25  SR04T TRIG</text>
    <text x="575" y="450">GPIO26  SR04T ECHO</text>
    <text x="575" y="480">GPIO15  Override BTN</text>
    <text x="575" y="510">GND</text>
    <text x="575" y="540">VIN (5V)</text>
  </g>
  <g font-size="12" fill="#ffffff" text-anchor="end">
    <text x="865" y="270">RX2 GPIO16  MAX485 RO</text>
    <text x="865" y="300">TX2 GPIO17  MAX485 DI</text>
    <text x="865" y="330">GPIO4   MAX485 DE/RE</text>
    <text x="865" y="360">GPIO18  DRV STEP</text>
    <text x="865" y="390">GPIO19  DRV DIR</text>
    <text x="865" y="420">GPIO21  DRV ENABLE</text>
    <text x="865" y="450">GPIO22  Feed-gate MOSFET</text>
    <text x="865" y="480">GPIO23  Water-valve MOSFET</text>
    <text x="865" y="510">GND</text>
    <text x="865" y="540">3V3 &#8594; DRV M0/M1/M2, SLP/RST</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="560" y1="266" x2="540" y2="266"/><line x1="560" y1="296" x2="540" y2="296"/>
