<svg viewBox="0 0 1440 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1440" height="1020" fill="#ffffff"/>
  <text x="720" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Power Architecture, Star Ground &amp; Actuator Driver Detail</text>
  <text x="720" y="58" text-anchor="middle" font-size="13" fill="#64748b">Dual-rail supply · single-point (star) ground · RS-485 termination · MOSFET flyback solenoid driver</text>

  <!-- ============ POWER TREE (top-left) ============ -->
  <rect x="40" y="90" width="640" height="330" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="118" font-size="16" font-weight="700" fill="#b91c1c">1 · Dual-Rail Power Distribution</text>

  <rect x="70" y="140" width="150" height="70" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="145" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">12 V / 10 A</text>
  <text x="145" y="188" text-anchor="middle" font-size="12" fill="#0f172a">SMPS</text>

  <!-- 12V rail -->
  <line x1="220" y1="160" x2="640" y2="160" stroke="#dc2626" stroke-width="3.5"/>
  <text x="360" y="152" font-size="12" font-weight="700" fill="#b91c1c">12 V ACTUATOR RAIL</text>
  <text x="470" y="180" font-size="11" fill="#334155">→ DRV8825 VMOT (×3) · solenoid coils (×6)</text>

  <!-- buck -->
  <rect x="70" y="240" width="150" height="70" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="145" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">LM2596</text>
  <text x="145" y="288" text-anchor="middle" font-size="11" fill="#0f172a">12V→5V Buck</text>
  <line x1="145" y1="210" x2="145" y2="240" stroke="#dc2626" stroke-width="2.5"/>
  <!-- 5V rail -->
  <line x1="220" y1="260" x2="640" y2="260" stroke="#ea580c" stroke-width="3"/>
  <text x="360" y="252" font-size="12" font-weight="700" fill="#c2410c">5 V LOGIC RAIL</text>
  <text x="360" y="298" font-size="11" fill="#334155">→ RPi 5 · ESP32 VIN (×3) · MAX485 (×4) · JSN-SR04T · MQ-135 heater</text>
  <!-- 3v3 note -->
  <text x="70" y="345" font-size="11" fill="#334155">3.3 V logic derived on-board (RPi / ESP32 regulators) → Ra-02 LoRa, HX711, dividers</text>
  <text x="70" y="368" font-size="11" fill="#b91c1c" font-weight="600">GSM module: dedicated 5 V rail ≥ 2.5 A (2 A TX bursts) — never off the MCU regulator</text>
  <text x="70" y="391" font-size="11" fill="#334155">Bulk caps at each buck output; 100 µF across every DRV8825 VMOT–GND.</text>

  <!-- ============ STAR GROUND (top-right) ============ -->
  <rect x="710" y="90" width="690" height="330" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="730" y="118" font-size="16" font-weight="700" fill="#0f172a">2 · Single-Point (Star) Ground</text>

  <!-- star node -->
  <circle cx="1055" cy="270" r="14" fill="#0f172a"/>
  <text x="1055" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">STAR POINT</text>
  <text x="1055" y="328" text-anchor="middle" font-size="11" fill="#64748b">at 12 V SMPS output terminal</text>

  <!-- branches -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <path d="M1055 270 L 820 170"/><path d="M1055 270 L 820 230"/>
    <path d="M1055 270 L 830 270"/>
    <path d="M1055 270 L 1290 160"/><path d="M1055 270 L 1295 230"/>
    <path d="M1055 270 L 1290 270"/>
  </g>
  <g font-size="11" fill="#334155">
    <rect x="700" y="150" width="120" height="34" rx="5" fill="#fff" stroke="#dc2626"/><text x="760" y="172" text-anchor="middle" fill="#b91c1c" font-weight="600">Actuator GND</text>
    <rect x="700" y="213" width="120" height="34" rx="5" fill="#fff" stroke="#dc2626"/><text x="760" y="235" text-anchor="middle" fill="#b91c1c" font-weight="600">Motor GND</text>
    <rect x="700" y="253" width="120" height="34" rx="5" fill="#fff" stroke="#ea580c"/><text x="760" y="275" text-anchor="middle" fill="#c2410c" font-weight="600">Buck GND</text>
    <rect x="1290" y="143" width="120" height="34" rx="5" fill="#fff" stroke="#1e40af"/><text x="1350" y="165" text-anchor="middle" fill="#1e3a8a" font-weight="600">Logic GND</text>
    <rect x="1295" y="213" width="120" height="34" rx="5" fill="#fff" stroke="#0e7490"/><text x="1355" y="235" text-anchor="middle" fill="#155e75" font-weight="600">Sensor GND</text>
    <rect x="1290" y="253" width="120" height="34" rx="5" fill="#fff" stroke="#334155"/><text x="1350" y="275" text-anchor="middle" font-weight="600">Earth (1 pt)</text>
  </g>
  <text x="1055" y="368" text-anchor="middle" font-size="11" fill="#334155">Keep high-current actuator returns separate from logic/sensor grounds until the single junction.</text>
  <text x="1055" y="390" text-anchor="middle" font-size="11" fill="#334155">Prevents ground bounce corrupting HX711 &amp; MQ-135 ADC readings. STP shield → Earth at Pi end only.</text>

  <!-- ============ RS-485 termination (mid) ============ -->
  <rect x="40" y="450" width="640" height="230" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="478" font-size="16" font-weight="700" fill="#b45309">3 · RS-485 Bus &amp; Termination</text>
  <!-- bus line -->
  <line x1="80" y1="560" x2="620" y2="560" stroke="#d97706" stroke-width="3"/>
  <line x1="80" y1="590" x2="620" y2="590" stroke="#d97706" stroke-width="3"/>
  <text x="90" y="552" font-size="11" font-weight="700" fill="#b45309">A</text>
  <text x="90" y="608" font-size="11" font-weight="700" fill="#b45309">B</text>
  <!-- termination resistors -->
  <line x1="110" y1="560" x2="110" y2="590" stroke="#0f172a" stroke-width="2"/>
  <rect x="102" y="566" width="16" height="18" fill="#fff" stroke="#0f172a"/>
  <text x="150" y="578" font-size="11" fill="#0f172a">120Ω @ Master</text>
  <line x1="590" y1="560" x2="590" y2="590" stroke="#0f172a" stroke-width="2"/>
  <rect x="582" y="566" width="16" height="18" fill="#fff" stroke="#0f172a"/>
  <text x="505" y="620" font-size="11" fill="#0f172a">120Ω @ Node 3</text>
  <!-- node taps -->
  <g stroke="#0e7490" stroke-width="2">
    <line x1="250" y1="560" x2="250" y2="530"/><line x1="250" y1="590" x2="250" y2="620"/>
    <line x1="420" y1="560" x2="420" y2="530"/><line x1="420" y1="590" x2="420" y2="620"/>
  </g>
  <text x="250" y="524" text-anchor="middle" font-size="10.5" fill="#155e75">Node 1</text>
  <text x="420" y="524" text-anchor="middle" font-size="10.5" fill="#155e75">Node 2</text>
  <text x="60" y="660" font-size="11" fill="#334155">Shielded twisted-pair · daisy-chain · half-duplex · DE/RE steers direction. Terminate only the two extreme ends.</text>

  <!-- ============ MOSFET DRIVER CLOSE-UP (bottom) ============ -->
  <rect x="40" y="705" width="1360" height="290" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="60" y="733" font-size="16" font-weight="700" fill="#3730a3">4 · Logic-Level MOSFET Solenoid Driver (per valve — IRLZ44N)</text>

  <!-- 12V rail top -->
  <line x1="620" y1="770" x2="1000" y2="770" stroke="#dc2626" stroke-width="3"/>
  <text x="1010" y="774" font-size="12" font-weight="700" fill="#b91c1c">+12 V Actuator Rail</text>

  <!-- Solenoid coil -->
  <text x="700" y="792" font-size="12" font-weight="700" fill="#0f172a">Solenoid coil</text>
  <path d="M760 770 v20 q0 12 12 12 t12 -12 t12 12 t12 -12 t12 12 t12 -12" transform="translate(-40,0)" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="720" y1="770" x2="720" y2="790"/>
  <rect x="700" y="800" width="90" height="0" />
  <line x1="720" y1="820" x2="720" y2="880" stroke="#0f172a" stroke-width="2"/>

  <!-- Flyback diode 1N4007 parallel to coil -->
  <line x1="820" y1="770" x2="820" y2="820" stroke="#0f172a" stroke-width="2"/>
  <polygon points="810,805 830,805 820,790" fill="#0f172a"/>
  <line x1="810" y1="790" x2="830" y2="790" stroke="#0f172a" stroke-width="2"/>
  <line x1="820" y1="820" x2="820" y2="880" stroke="#0f172a" stroke-width="2"/>
  <line x1="720" y1="880" x2="820" y2="880" stroke="#0f172a" stroke-width="2"/>
  <text x="838" y="800" font-size="11" fill="#334155">1N4007 flyback</text>
  <text x="838" y="816" font-size="10" fill="#64748b">(cathode/stripe → +12V)</text>

  <!-- MOSFET symbol -->
  <text x="640" y="905" font-size="12" font-weight="700" fill="#0f172a">IRLZ44N</text>
  <line x1="720" y1="880" x2="720" y2="900" stroke="#0f172a" stroke-width="2"/>
  <!-- drain line into transistor -->
  <line x1="700" y1="900" x2="740" y2="900" stroke="#0f172a" stroke-width="2"/>
  <text x="748" y="898" font-size="10" fill="#64748b">D</text>
  <!-- channel -->
  <line x1="700" y1="895" x2="700" y2="945" stroke="#0f172a" stroke-width="3"/>
  <line x1="700" y1="945" x2="740" y2="945" stroke="#0f172a" stroke-width="2"/>
  <text x="748" y="948" font-size="10" fill="#64748b">S</text>
  <!-- gate -->
  <line x1="680" y1="905" x2="680" y2="935" stroke="#0f172a" stroke-width="2"/>
  <line x1="680" y1="920" x2="620" y2="920" stroke="#0f172a" stroke-width="2"/>
  <!-- gate resistor 220 -->
  <rect x="540" y="912" width="40" height="16" fill="#fff" stroke="#0f172a"/>
  <text x="560" y="906" text-anchor="middle" font-size="10" fill="#0f172a">220Ω</text>
  <line x1="580" y1="920" x2="620" y2="920" stroke="#0f172a" stroke-width="2"/>
  <line x1="490" y1="920" x2="540" y2="920" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="905" font-size="12" font-weight="700" fill="#0e7490">ESP32 GPIO22 / GPIO23</text>
  <!-- pulldown 10k -->
  <line x1="600" y1="920" x2="600" y2="960" stroke="#0f172a" stroke-width="2"/>
  <rect x="592" y="940" width="16" height="20" fill="#fff" stroke="#0f172a"/>
  <text x="560" y="985" font-size="10" fill="#0f172a">10kΩ pulldown</text>
  <!-- source to ground -->
  <line x1="720" y1="945" x2="720" y2="965" stroke="#0f172a" stroke-width="2"/>
  <line x1="600" y1="960" x2="600" y2="965" stroke="#0f172a" stroke-width="2"/>
  <line x1="560" y1="965" x2="760" y2="965" stroke="#0f172a" stroke-width="2.5"/>
  <text x="770" y="969" font-size="11" font-weight="700" fill="#0f172a">GND (star)</text>
  <!-- ground symbol -->
  <line x1="660" y1="965" x2="660" y2="978" stroke="#0f172a" stroke-width="2"/>
  <line x1="648" y1="978" x2="672" y2="978" stroke="#0f172a" stroke-width="2"/>
  <line x1="653" y1="983" x2="667" y2="983" stroke="#0f172a" stroke-width="2"/>
  <line x1="657" y1="988" x2="663" y2="988" stroke="#0f172a" stroke-width="2"/>

  <!-- notes right -->
  <g font-size="12" fill="#334155">
    <text x="1000" y="810" font-weight="700" fill="#3730a3">Why each part:</text>
    <text x="1000" y="834">• 220Ω gate — limits inrush into gate capacitance.</text>
    <text x="1000" y="856">• 10kΩ pulldown — valve stays closed during ESP32 boot/reset.</text>
    <text x="1000" y="878">• 1N4007 flyback — clamps coil back-EMF at turn-off.</text>
    <text x="1000" y="900">• IRLZ44N — logic-level, fully on at 3.3 V gate drive.</text>
    <text x="1000" y="922">• Solenoids draw ~0.5–0.7 A @ 12 V; ESP32 GPIO ≈ 12–20 mA.</text>
    <text x="1000" y="944" fill="#b91c1c">• Same circuit ×2 per node: GPIO22 feed gate, GPIO23 water valve.</text>
  </g>
</svg>
